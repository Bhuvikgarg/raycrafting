<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5f7"/>
      <stop offset="100%" stop-color="#ffe4eb"/>
    </radialGradient>
    <radialGradient id="pistil" cx="40%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#fff8ad"/>
      <stop offset="35%" stop-color="#fdb31c"/>
      <stop offset="80%" stop-color="#ea7412"/>
      <stop offset="100%" stop-color="#b65008"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(196,95,124,0.3)"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <g transform="translate(32,32)" filter="url(#shadow)">
    <!-- 8 soft daisy petals -->
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(45)"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(90)"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(135)"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(180)"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(225)"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(270)"/>
    <ellipse cx="0" cy="-18" rx="6.5" ry="11" fill="#ffffff" stroke="#e8a8b8" stroke-width="0.9" transform="rotate(315)"/>
    <!-- golden center -->
    <circle cx="0" cy="0" r="8.5" fill="url(#pistil)" stroke="#b65008" stroke-width="0.6"/>
    <circle cx="-2.5" cy="-2.5" r="2.6" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>